<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ali Mukhtar | Systems & Cloud Infrastructure Hub</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Premium Light/Modern Corporate Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/pure.css">
  
  <style>
    :root {
      --theme-color: #0a66c2; /* Authentic LinkedIn Corporate Blue */
      --base-font-size: 15px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      color: #191919;
      background-color: #f3f2ef; /* LinkedIn Soft Gray Background */
      line-height: 1.5;
    }
    .sidebar {
      background-color: #ffffff !important;
      border-right: 1px solid #dee2e6;
    }
    .markdown-section {
      max-width: 800px;
      padding: 20px 15px 40px 15px;
    }
    
    /* LinkedIn Style Sidebar Header Card */
    .profile-card {
      text-align: center;
      padding: 25px 15px;
      border-bottom: 1px solid #e9ecef;
      background: #ffffff;
    }
    .profile-card img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid #0a66c2;
      object-fit: cover;
    }
    .profile-card h1 {
      font-size: 16px;
      font-weight: 600;
      color: #000000;
      margin: 10px 0 2px 0;
    }
    .profile-card p {
      font-size: 12px;
      color: #666666;
      margin: 0;
      font-weight: 400;
    }

    /* LinkedIn Card Component Structure */
    .linkedin-card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.01), 0 2px 4px rgba(0,0,0,0.02);
    }
    .linkedin-card h2 {
      font-size: 20px;
      font-weight: 600;
      color: #000000;
      margin-top: 0;
      margin-bottom: 16px;
      border: none;
      padding: 0;
    }
    
    /* Profile Summary Grid Info */
    .summary-badge-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .summary-badge-pill {
      background: #eef3f8;
      color: #0a66c2;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 16px;
    }

    /* Chronological Job Block Lists */
    .experience-item {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    .experience-item:last-child {
      margin-bottom: 0;
    }
    .company-logo-placeholder {
      width: 48px;
      height: 48px;
      background: #f3f2ef;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #666666;
      font-size: 14px;
      flex-shrink: 0;
    }
    .exp-details h3 {
      font-size: 16px;
      font-weight: 600;
      color: #000000;
      margin: 0 0 4px 0;
    }
    .exp-company {
      font-size: 14px;
      color: #191919;
      margin-bottom: 2px;
    }
    .exp-date {
      font-size: 12px;
      color: #666666;
      margin-bottom: 8px;
    }

    /* LinkedIn Style Stationary Badge Grid */
    .badge-grid-layout {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 12px;
    }
    .badge-item-card {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      background: #ffffff;
    }
    .badge-graphic-frame {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }
    .badge-graphic-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .badge-meta h4 {
      font-size: 14px;
      font-weight: 600;
      color: #000000;
      margin: 0 0 2px 0;
    }
    .badge-meta p {
      font-size: 12px;
      color: #666666;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="app">Loading Profile Dashboard...</div>
  <script>
    window.$docsify = {
      name: 'Portfolio',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search user portfolio...',
        noData: 'No entries found',
        depth: 2
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
