<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ali Mukhtar | Cloud Infrastructure Portfolio</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Modern Clean Corporate Style Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/pure.css">
  
  <style>
    :root {
      --theme-color: #0066cc; /* Professional Corporate Blue */
    }
    .sidebar {
      background-color: #f8f9fa !important;
      border-right: 1px solid #e9ecef;
    }
    .sidebar-nav strong {
      color: #333333;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    /* Profile Image Ring Styling */
    .profile-block {
      text-align: center;
      padding: 20px 10px 10px 10px;
    }
    .profile-block img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #0066cc;
      object-fit: cover;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .profile-title {
      font-size: 16px;
      font-weight: bold;
      color: #2b2b2b;
      margin-top: 10px;
      margin-bottom: 2px;
    }
    .profile-subtitle {
      font-size: 12px;
      color: #6c757d;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div id="app">Loading professional infrastructure journal...</div>
  <script>
    window.$docsify = {
      name: 'Ali Mukhtar | Cloud Portfolio',
      repo: 'https://github.com',
      loadSidebar: true,
      subMaxLevel: 2,
      // Global Search Bar Activation
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search technical labs...',
        noData: 'No matching documentation found',
        depth: 3
      }
    }
  </script>
  <!-- Docsify Core and Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
