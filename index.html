<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ali Mukhtar | Systems & Cloud Infrastructure Portfolio</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Premium Light Modern Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/pure.css">
  
  <style>
    :root {
      --theme-color: #0b5ed7; /* Professional Corporate Blue */
      --base-font-size: 14px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif !important;
      color: #2b303a;
      background-color: #ffffff;
      line-height: 1.6;
    }
    .sidebar {
      background-color: #f8f9fa !important;
      border-right: 1px solid #dee2e6;
    }
    .markdown-section {
      max-width: 880px;
      padding: 25px 15px;
    }
    
    /* Sidebar Profile Component */
    .profile-card {
      text-align: center;
      padding: 20px 10px;
      border-bottom: 1px solid #e9ecef;
      background: #ffffff;
    }
    .profile-card img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #0b5ed7;
      object-fit: cover;
    }
    .profile-card h1 {
      font-size: 15px;
      font-weight: 700;
      color: #1a1f2c;
      margin: 10px 0 2px 0;
    }
    .profile-card p {
      font-size: 11px;
      color: #6c757d;
      margin: 0;
    }
    
    /* COMPACT ENTERPRISE BADGE GRID (SMALL UNIFORM BOXES ROW) */
    .compact-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }
    .small-badge-box {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 140px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .small-badge-box img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .small-badge-box .text-wrap {
      display: flex;
      flex-direction: column;
    }
    .small-badge-box .title {
      font-size: 12px;
      font-weight: 700;
      color: #1a1f2c;
      line-height: 1.2;
    }
    .small-badge-box .subtitle {
      font-size: 10px;
      color: #0b5ed7;
      font-weight: 600;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .small-badge-box .subtitle.grey-sub {
      color: #6c757d;
    }

    /* Professional Experience Blocks */
    .job-card {
      border-left: 3px solid #0b5ed7;
      padding-left: 18px;
      margin: 22px 0;
    }
    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .job-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1f2c;
    }
    .job-company {
      font-size: 13px;
      font-weight: 600;
      color: #495057;
    }
    .job-date {
      font-size: 12px;
      color: #6c757d;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="app">Loading Portfolio Dashboard...</div>
  <script>
    window.$docsify = {
      name: 'Portfolio Hub',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search technical records...',
        noData: 'No entries found',
        depth: 2
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
